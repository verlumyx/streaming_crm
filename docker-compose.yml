services:
  postgres:
    build:
      context: ./docker/postgres
    image: streaming-crm-postgres:16-pgvector
    container_name: streaming_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: streaming_crm
      POSTGRES_USER: streaming_crm
      POSTGRES_PASSWORD: streaming_crm
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming_crm -d streaming_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
